<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="40%" stop-color="#0d111e"/>
      <stop offset="70%" stop-color="#140d17"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>

    <!-- Radar Sweep Radial Gradient -->
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1320" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="active-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241118" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#140d16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Crimson Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="app-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(239, 68, 68, 0.05)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
  </style>

  <!-- App Screen Base -->
  <rect width="420" height="880" fill="url(#app-bg)"/>
  <rect width="420" height="880" fill="url(#app-grid)"/>

  <!-- Top Ambient Glow Behind Shield -->
  <circle cx="210" cy="220" r="160" fill="url(#radar-glow)"/>

  <!-- STATUS BAR (Top) -->
  <g class="font-sans" font-size="12" fill="#ffffff" font-weight="600">
    <text x="36" y="32">09:41</text>
    <!-- Cellular Signal -->
    <g transform="translate(320, 22)" fill="#ffffff">
      <rect x="0" y="8" width="3" height="4" rx="0.5"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
    </g>
    <!-- 5G text -->
    <text x="342" y="32" font-size="10" font-weight="700" fill="rgba(255,255,255,0.85)">5G</text>
    <!-- Battery Icon -->
    <g transform="translate(364, 21)" stroke="#ffffff" stroke-width="1.2" fill="none">
      <rect x="0" y="0" width="22" height="12" rx="3"/>
      <rect x="2" y="2" width="15" height="8" rx="1.5" fill="#22c55e" stroke="none"/>
      <path d="M 23 4 L 23 8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- APP HEADER -->
  <g transform="translate(24, 66)">
    <!-- Shield Logo Mini -->
    <g transform="translate(0, 0)">
      <path d="M 12 0 L 24 6 C 24 18, 16 26, 12 30 C 8 26, 0 18, 0 6 Z" fill="url(#shield-grad)"/>
      <path d="M 12 6 L 12 24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 6 12 L 12 12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="34" y="20" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">SIGAP</text>
    <text x="34" y="32" class="font-mono" font-size="9" font-weight="600" fill="#f87171" letter-spacing="1.5">SECURITY ENGINE</text>

    <!-- Status Badge (Armed) -->
    <rect x="236" y="2" width="136" height="28" rx="14" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.45)" stroke-width="1.2"/>
    <circle cx="250" cy="16" r="4.5" fill="#ef4444" filter="url(#soft-glow)"/>
    <text x="262" y="20" class="font-mono" font-size="10" font-weight="700" fill="#fca5a5" letter-spacing="0.8">ARMED &amp; ACTIVE</text>
  </g>

  <!-- MAIN RADAR & MOTION SENSOR VISUALIZER -->
  <g transform="translate(210, 210)">
    <!-- Outer concentric radar circles -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="rgba(239, 68, 68, 0.15)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="34" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="2" filter="url(#soft-glow)"/>

    <!-- Radar Crosshairs -->
    <line x1="-96" y1="0" x2="96" y2="0" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1"/>
    <line x1="0" y1="-96" x2="0" y2="96" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1"/>

    <!-- Central Shield Hero -->
    <g transform="translate(0, -6)">
      <path d="M 0 -22 L 18 -12 C 18 10, 8 22, 0 28 C -8 22, -18 10, -18 -12 Z" fill="url(#shield-grad)" filter="url(#neon-glow)"/>
      <path d="M 0 -22 L 18 -12 C 18 10, 8 22, 0 28 C -8 22, -18 10, -18 -12 Z" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
      <path d="M -6 2 L -1 7 L 8 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Motion Wave Arc Graphic -->
    <path d="M -80 -25 C -50 -55, 50 -55, 80 -25" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M -65 -20 C -40 -42, 40 -42, 65 -20" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sensor Reading Pill -->
    <g transform="translate(0, 102)">
      <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#090d16" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="10.5" fill="#cbd5e1" font-weight="600">
        <tspan fill="#38bdf8">STREAM XYZ:</tspan> Δ 0.04 <tspan fill="#64748b">/ 2.0 MAX</tspan>
      </text>
    </g>
  </g>

  <!-- 4 PRIMARY FEATURE CARDS (Directly Matching User Requirements) -->
  <g transform="translate(24, 340)">
    
    <!-- CARD 1: Motion Detection -->
    <g transform="translate(0, 0)">
      <rect width="372" height="66" rx="12" fill="url(#card-bg)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.2"/>
      <!-- Icon Box -->
      <rect x="12" y="13" width="40" height="40" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
      <g transform="translate(24, 25)" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M 0 8 C 4 0, 12 16, 16 8"/>
        <circle cx="8" cy="8" r="1.5" fill="#ef4444"/>
      </g>
      <!-- Texts -->
      <text x="62" y="29" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Motion Detection</text>
      <text x="62" y="46" class="font-mono" font-size="10" fill="#94a3b8">Sensors Plus Akselerometer Sumbu XYZ</text>
      <!-- Active Badge -->
      <rect x="296" y="21" width="64" height="22" rx="11" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
      <text x="328" y="35" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#4ade80">AKTIF</text>
    </g>

    <!-- CARD 2: Charger Removal Detection & Alarm -->
    <g transform="translate(0, 74)">
      <rect width="372" height="66" rx="12" fill="url(#card-bg)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.2"/>
      <!-- Icon Box -->
      <rect x="12" y="13" width="40" height="40" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
      <g transform="translate(26, 25)" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M 4 2 L 4 7 M 9 2 L 9 7"/>
        <rect x="1.5" y="7" width="10" height="9" rx="1.5" fill="#ef4444"/>
        <path d="M 6.5 16 L 6.5 20"/>
      </g>
      <!-- Texts -->
      <text x="62" y="29" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Charger Removal &amp; Alarm</text>
      <text x="62" y="46" class="font-mono" font-size="10" fill="#94a3b8">Kabel Dicabut → Sirine Looping 100%</text>
      <!-- Armed Badge -->
      <rect x="296" y="21" width="64" height="22" rx="11" fill="rgba(239, 68, 68, 0.18)" stroke="rgba(239, 68, 68, 0.5)" stroke-width="1"/>
      <text x="328" y="35" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#fca5a5">ARMED</text>
    </g>

    <!-- CARD 3: 100% Volume Watchdog & Layar PIN -->
    <g transform="translate(0, 148)">
      <rect width="372" height="66" rx="12" fill="url(#card-bg)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1.2"/>
      <!-- Icon Box -->
      <rect x="12" y="13" width="40" height="40" rx="8" fill="rgba(0, 243, 255, 0.12)"/>
      <g transform="translate(25, 25)" stroke="#00f3ff" stroke-width="1.8" fill="none" stroke-linecap="round">
        <polygon points="1,6 5,6 10,1 10,15 5,10 1,10" fill="#00f3ff"/>
        <path d="M 12 4 C 14 6, 14 10, 12 12"/>
      </g>
      <!-- Texts -->
      <text x="62" y="29" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">100% Volume &amp; Layar PIN</text>
      <text x="62" y="46" class="font-mono" font-size="10" fill="#94a3b8">Anti-Mute &amp; Kunci Layar Immersive</text>
      <!-- Lock Badge -->
      <rect x="296" y="21" width="64" height="22" rx="11" fill="rgba(0, 243, 255, 0.12)" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1"/>
      <text x="328" y="35" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#67e8f9">LOCKED</text>
    </g>

    <!-- CARD 4: Intruder Selfie Kamera Depan & Snapshot GPS -->
    <g transform="translate(0, 222)">
      <rect width="372" height="66" rx="12" fill="url(#card-bg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
      <!-- Icon Box -->
      <rect x="12" y="13" width="40" height="40" rx="8" fill="rgba(168, 85, 247, 0.15)"/>
      <g transform="translate(25, 25)" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M 2 5 L 4 2 L 10 2 L 12 5 L 14 5 C 15 5, 16 6, 16 7 L 16 13 C 16 14, 15 15, 14 15 L 2 15 C 1 15, 0 14, 0 13 L 0 7 C 0 6, 1 5, 2 5 Z"/>
        <circle cx="7" cy="9.5" r="2.8"/>
      </g>
      <!-- Texts -->
      <text x="62" y="29" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Intruder Selfie &amp; Snapshot GPS</text>
      <text x="62" y="46" class="font-mono" font-size="10" fill="#94a3b8">Potret Kamera Depan &amp; Catat Koordinat</text>
      <!-- Ready Badge -->
      <rect x="296" y="21" width="64" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <text x="328" y="35" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#c084fc">SIAP</text>
    </g>

  </g>

  <!-- EMERGENCY PIN KEYPAD INTERFACE (Bottom) -->
  <g transform="translate(24, 650)">
    <rect width="372" height="180" rx="16" fill="url(#active-card-bg)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.2"/>
    
    <text x="186" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1">
      KEAMANAN DARURAT: MASUKKAN PIN
    </text>

    <!-- 4 PIN Bullet Dots -->
    <g transform="translate(186, 48)">
      <circle cx="-36" cy="0" r="6" fill="#ef4444" filter="url(#soft-glow)"/>
      <circle cx="-12" cy="0" r="6" fill="#ef4444" filter="url(#soft-glow)"/>
      <circle cx="12" cy="0" r="6" fill="rgba(255,255,255,0.2)"/>
      <circle cx="36" cy="0" r="6" fill="rgba(255,255,255,0.2)"/>
    </g>

    <!-- Mini Keypad Preview (Clean Touch UI) -->
    <g transform="translate(68, 70)" class="font-mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">1</text>
      </g>
      <g transform="translate(84, 0)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">2</text>
      </g>
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">3</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">4</text>
      </g>
      <g transform="translate(84, 32)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">5</text>
      </g>
      <g transform="translate(168, 32)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="34" y="18">6</text>
      </g>

      <!-- Row 3: Action Button -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="236" height="30" rx="8" fill="#b91c1c"/>
        <text x="118" y="20" font-size="11" fill="#ffffff" letter-spacing="1">DISARM / MATIKAN ALARM</text>
      </g>
    </g>
  </g>

  <!-- HOME BAR INDICATOR (Bottom) -->
  <rect x="145" y="862" width="130" height="4.5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
</svg>
