<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 243, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="180" fill="url(#glow)"/>
  <rect x="1" y="1" width="798" height="448" rx="8" fill="none" stroke="rgba(0, 243, 255, 0.15)" stroke-width="2"/>

  <!-- Icon: Neural Network / Connectome nodes -->
  <g transform="translate(400, 160)" stroke="#00f3ff" stroke-width="2" fill="none">
    <circle cx="0" cy="-35" r="9" fill="#00f3ff" fill-opacity="0.8"/>
    <circle cx="-50" cy="15" r="7" fill="#00f3ff" fill-opacity="0.6"/>
    <circle cx="50" cy="15" r="7" fill="#00f3ff" fill-opacity="0.6"/>
    <circle cx="-25" cy="45" r="6" fill="#00f3ff" fill-opacity="0.5"/>
    <circle cx="25" cy="45" r="6" fill="#00f3ff" fill-opacity="0.5"/>
    <circle cx="0" cy="10" r="5" fill="#38bdf8"/>
    
    <line x1="0" y1="-35" x2="-50" y2="15" stroke="rgba(0,243,255,0.4)"/>
    <line x1="0" y1="-35" x2="50" y2="15" stroke="rgba(0,243,255,0.4)"/>
    <line x1="-50" y1="15" x2="0" y2="10" stroke="rgba(0,243,255,0.3)"/>
    <line x1="50" y1="15" x2="0" y2="10" stroke="rgba(0,243,255,0.3)"/>
    <line x1="-50" y1="15" x2="-25" y2="45" stroke="rgba(0,243,255,0.3)"/>
    <line x1="50" y1="15" x2="25" y2="45" stroke="rgba(0,243,255,0.3)"/>
    <line x1="-25" y1="45" x2="25" y2="45" stroke="rgba(0,243,255,0.3)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="275" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="2">NEUROFLY</text>
  <text x="400" y="308" text-anchor="middle" fill="#00f3ff" font-family="'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="3">COMPUTATIONAL NEUROSCIENCE // PONG SIMULATION</text>
  <text x="400" y="330" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Janelia MaleCNS v1.0 Biological Neural Controller</text>
</svg>
