<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-bingkai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <radialGradient id="glow-bingkai" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-bingkai" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168, 85, 247, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-bingkai)"/>
  <rect width="100%" height="100%" fill="url(#grid-bingkai)"/>
  <circle cx="400" cy="200" r="180" fill="url(#glow-bingkai)"/>
  <rect x="1" y="1" width="798" height="448" rx="8" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="2"/>

  <!-- Icon: Photo Frame & Controller -->
  <g transform="translate(400, 160)" fill="none" stroke="#a855f7" stroke-width="2">
    <!-- Picture frame -->
    <rect x="-42" y="-36" width="84" height="64" rx="6" stroke="#a855f7"/>
    <!-- Photo inner landscape -->
    <circle cx="-18" cy="-16" r="6" fill="#a855f7" fill-opacity="0.6"/>
    <path d="M -34 16 L -10 -6 L 10 10 L 22 2 L 34 16" stroke="#c084fc" fill="none"/>
    <!-- Controller badge corner -->
    <rect x="22" y="10" width="26" height="20" rx="4" fill="#111827" stroke="#00f3ff"/>
    <circle cx="29" cy="20" r="2" fill="#00f3ff"/>
    <circle cx="41" cy="20" r="2" fill="#00f3ff"/>
  </g>

  <!-- Typography -->
  <text x="400" y="275" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="2">BINGKAI</text>
  <text x="400" y="308" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="3">PHOTO MANAGEMENT // LOCAL-FIRST CONTROLLER</text>
  <text x="400" y="330" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Local Indexing • Gamepad &amp; Smartphone Control • SHA-256 Deduplication</text>
</svg>
